name: latest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commander-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
      - name: Test
        run: |
          make test
          go test -race ./...
      - name: Build
        run: make build
      - name: Fresh system Git
        run: |
          docker run --rm -v "$PWD/dist/commander:/usr/local/bin/commander:ro" \
            -e COMMANDER_HOME=/tmp/commander debian:bookworm-slim sh -ec '
              ! command -v git
              commander exec -- git --version
              commander exec -- git init --bare /tmp/origin
              commander exec -- git clone /tmp/origin /tmp/checkout
              test -d /tmp/checkout/.git
              test ! -e /tmp/commander/tools/docker
            '
      - name: Fresh setup and relocation
        run: |
          install_dir="$RUNNER_TEMP/commander-fresh"
          mkdir -p "$install_dir"
          cp dist/commander "$install_dir/commander"
          "$install_dir/commander" setup
          "$install_dir/commander" setup
          mv "$install_dir" "$RUNNER_TEMP/commander moved"
          "$RUNNER_TEMP/commander moved/commander" doctor
          touch "$RUNNER_TEMP/commander moved/.integration-fixture"
      - name: Native login fixtures, container and update
        env:
          COMMANDER_INTEGRATION_HOME: ${{ runner.temp }}/commander moved
        run: go test -tags integration -run '^TestIntegration' -v -timeout 15m ./...
      - name: Development container
        run: |
          docker build -f .devcontainer/Dockerfile -t commander-development-check .
          docker run --rm -v "$PWD:/workspace:ro" -e GOCACHE=/tmp/go-build -e GOMODCACHE=/tmp/go-mod commander-development-check make test
      - uses: actions/upload-artifact@v4
        with:
          name: commander
          path: dist/commander
          retention-days: 1

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: commander
          path: dist
      - name: Publish a fresh latest release
        run: |
          cd dist
          sha256sum commander > SHA256SUMS
          printf 'Commander for WSL and Linux on x86_64.\n\nNamed sessions select accounts and repositories. Selective encrypted transfer optionally includes shared memory. Project containers connect Git at runtime. Tasks integrate verified work and remove temporary branches and worktrees. Docker Engine/Desktop remains a prerequisite for project containers.\n\nBuild: %s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes"
          # A new release per build keeps its date equal to the binary's.
          gh release list --limit 100 --json tagName --jq '.[].tagName' |
          while IFS= read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes
          done
          if gh api "repos/$GH_REPO/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GH_REPO/git/refs/tags/latest"
          fi
          # Deleted tags can take a moment to disappear on GitHub.
          for attempt in 1 2 3 4 5; do
            gh release create latest commander SHA256SUMS --target "$GITHUB_SHA" --title latest --latest --notes-file "$RUNNER_TEMP/release-notes" && break
            test "$attempt" -lt 5
            sleep 5
          done
          test "$(gh release list --json tagName --jq 'length')" = 1
          test "$(gh api "repos/$GH_REPO/git/ref/tags/latest" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh release view latest --json assets --jq '[.assets[].name] | sort | join(",")')" = SHA256SUMS,commander
      - name: Verify published download
        run: |
          mkdir "$RUNNER_TEMP/release-check"
          cd "$RUNNER_TEMP/release-check"
          gh release download latest --pattern commander --pattern SHA256SUMS
          sha256sum --check SHA256SUMS
          chmod +x commander
          test "$(./commander version)" = "Commander $GITHUB_SHA linux/amd64"
