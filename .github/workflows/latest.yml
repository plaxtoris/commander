name: latest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commander-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: check ${{ matrix.machine }}
    strategy:
      matrix:
        include: &machines
          - runner: ubuntu-24.04
            machine: x86_64
            arch: amd64
          - runner: ubuntu-24.04-arm
            machine: aarch64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      COMMANDER: dist/commander-${{ matrix.machine }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true
      - name: Test
        run: |
          make test
          go test -race ./...
      - name: Build
        run: |
          make build
          test "$(uname -m)" = "${{ matrix.machine }}"
          test "$("$COMMANDER" version)" = "Commander $(git rev-parse HEAD) linux/${{ matrix.arch }}"
      - name: Fresh system Git
        run: |
          docker run --rm -v "$PWD/$COMMANDER:/usr/local/bin/commander:ro" \
            -e COMMANDER_HOME=/tmp/commander debian:bookworm-slim sh -ec '
              ! command -v git
              commander exec -- git --version
              commander exec -- git init --bare /tmp/origin
              commander exec -- git clone /tmp/origin /tmp/checkout
              test -d /tmp/checkout/.git
              test ! -e /tmp/commander/tools/docker
            '
      - name: Fresh setup and relocation
        run: |
          install_dir="$RUNNER_TEMP/commander-fresh"
          mkdir -p "$install_dir"
          cp "$COMMANDER" "$install_dir/commander"
          "$install_dir/commander" setup
          "$install_dir/commander" setup
          mv "$install_dir" "$RUNNER_TEMP/commander moved"
          "$RUNNER_TEMP/commander moved/commander" doctor
          touch "$RUNNER_TEMP/commander moved/.integration-fixture"
      - name: Native login fixtures, container and update
        env:
          COMMANDER_INTEGRATION_HOME: ${{ runner.temp }}/commander moved
        run: go test -tags integration -run '^TestIntegration' -v -timeout 15m ./...
      - name: Development container
        run: |
          docker build -f .devcontainer/Dockerfile -t commander-development-check .
          docker run --rm -v "$PWD:/workspace:ro" -e GOCACHE=/tmp/go-build -e GOMODCACHE=/tmp/go-mod commander-development-check make test
      - uses: actions/upload-artifact@v7
        with:
          name: commander-${{ matrix.machine }}
          path: dist/commander-${{ matrix.machine }}
          retention-days: 1

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: commander-*
          merge-multiple: true
          path: dist
      - name: Publish a fresh latest release
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # Installs from before aarch64 support update from the plain name.
          cp commander-x86_64 commander
          assets="commander commander-aarch64 commander-x86_64"
          sha256sum $assets > SHA256SUMS
          printf 'Commander for WSL and Linux on x86_64 and aarch64.\n\nNamed sessions select accounts and repositories. Encrypted transfer includes shared agent settings and can include shared memory. Project containers connect Git at runtime. Tasks integrate verified work and remove temporary branches and worktrees. Docker Engine/Desktop remains a prerequisite for project containers.\n\nBuild: %s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes"
          # A new release per build keeps its date equal to the binary's. The
          # draft holds the uploaded files, so latest is missing only briefly.
          draft="build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$draft" $assets SHA256SUMS --draft --target "$GITHUB_SHA" --title latest --notes-file "$RUNNER_TEMP/release-notes"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | { grep -vx "$draft" || true; } |
          while IFS= read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes
          done
          if gh api "repos/$GH_REPO/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GH_REPO/git/refs/tags/latest"
          fi
          # Deleted tags can take a moment to disappear on GitHub.
          for attempt in 1 2 3 4 5; do
            gh release edit "$draft" --tag latest --target "$GITHUB_SHA" --draft=false --latest && break
            test "$attempt" -lt 5
            sleep 5
          done
          # Renaming a draft can succeed while GitHub still marks it as a draft.
          if test "$(gh release view latest --json isDraft --jq .isDraft)" = true; then
            id=$(gh api "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == "latest") | .id')
            test -n "$id"
            gh api --method PATCH "repos/$GH_REPO/releases/$id" -F draft=false -f make_latest=true --silent
          fi
          test "$(gh release view latest --json isDraft --jq .isDraft)" = false
          test "$(gh release list --json tagName --jq 'length')" = 1
          test "$(gh api "repos/$GH_REPO/git/ref/tags/latest" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh release view latest --json assets --jq '[.assets[].name] | sort | join(",")')" = SHA256SUMS,commander,commander-aarch64,commander-x86_64

  published:
    name: published ${{ matrix.machine }}
    needs: release
    strategy:
      matrix:
        include: *machines
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Install with the README command
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          latest="https://github.com/${{ github.repository }}/releases/download/latest"
          curl --retry 5 --retry-all-errors -fL -o commander "$latest/commander-$(uname -m)"
          chmod +x commander
          curl --retry 5 --retry-all-errors -fsSL "$latest/SHA256SUMS" | awk -v asset="commander-$(uname -m)" '$2 == asset { print $1 "  commander" }' | sha256sum --check
          test "$(./commander version)" = "Commander $GITHUB_SHA linux/${{ matrix.arch }}"
